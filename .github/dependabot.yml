# 의존성 업데이트 알림 (보안 감사 2026-10-18 F-04). package.json 은 정확 버전 고정 — increase 로 유지.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    versioning-strategy: increase
    open-pull-requests-limit: 5
    ignore:
      # TS 7 은 typescript-eslint 8.x 피어 범위(<6.1.0) 밖 — 지원 릴리스 전까지 major 보류 (PR #76 닫음)
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
